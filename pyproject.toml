[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openpklab"
version = "0.1.0"
description = "A self-hosted, traceable scientific notebook and MCP server for PK/PD research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "OpenPKLab contributors"}]
dependencies = [
  "mcp>=1.26,<2", "numpy>=2,<3", "scipy>=1.15,<2", "pandas>=2.2,<4",
  "matplotlib>=3.9,<4", "openpyxl>=3.1,<4", "Pillow>=11,<13", "PyJWT[crypto]>=2.10,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "build>=1,<2"]
[project.scripts]
openpklab = "openpklab.cli:main"
[project.entry-points."openpklab.plugins"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.hatch.build.targets.wheel]
packages = ["src/openpklab"]
